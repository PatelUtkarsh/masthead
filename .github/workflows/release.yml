name: Release

# Run from the Actions tab on main after the version is bumped on main
# (bin/bump-version.sh X.Y.Z). The workflow:
#   1. runs the full CI suite,
#   2. builds the plugin and checks every version string,
#   3. commits build/ in a release commit on top of main (main itself is not changed),
#   4. tags that commit vX.Y.Z and pushes only the tag,
#   5. publishes a GitHub release with masthead-X.Y.Z.zip.
# Composer reads tags, so `composer require patelutkarsh/masthead` gets build/
# while the main branch never tracks it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.2.0 (no "v").
        required: true
        type: string
      prerelease:
        description: Mark as a pre-release.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, tag and publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run the release workflow from main." >&2
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag is new
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check versions
        run: bin/check-version.sh "$VERSION"

      - name: Build and package
        run: bin/package.sh "$VERSION"

      - name: Commit build/ and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -f build
          git commit -q -m "chore(release): Masthead ${VERSION}" \
            -m "Adds the built assets in build/ for Composer installs. This commit sits on top of main and is reachable only from tag v${VERSION}."
          git tag -a "v${VERSION}" -m "Masthead ${VERSION}"
          git push origin "refs/tags/v${VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v${VERSION}" "dist/masthead-${VERSION}.zip" \
            --title "Masthead ${VERSION}" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
